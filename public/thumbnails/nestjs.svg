<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d14" />
      <stop offset="100%" stop-color="#120508" />
    </linearGradient>
    <linearGradient id="nest-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0234e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#nest-bg)"/>
  <rect x="0" y="0" width="400" height="4" fill="url(#nest-glow)"/>
  <circle cx="340" cy="40" r="100" fill="#e0234e" opacity="0.1" filter="blur(30px)"/>
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#e0234e" fill-opacity="0.15" stroke="#e0234e" stroke-opacity="0.4"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#fb7185" text-anchor="middle">🐈</text>
    <text x="64" y="28" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">NestJS Backend</text>
    <text x="64" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">TypeScript • Modular • Microservices</text>
  </g>
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
    <text x="55" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">⏱ 16 Weeks</text>
    <rect x="120" y="0" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
    <text x="175" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">📚 30 Topics</text>
  </g>
