    <rect x="0" y="0" width="48" height="48" rx="10" fill="#6db33f" fill-opacity="0.15" stroke="#6db33f" stroke-opacity="0.4"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#86efac" text-anchor="middle">🍃</text>
