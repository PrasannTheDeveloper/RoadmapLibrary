<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="spring-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142e1b" />
      <stop offset="100%" stop-color="#08140b" />
    </linearGradient>
    <linearGradient id="spring-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6db33f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#spring-bg)"/>
  <rect x="0" y="0" width="400" height="4" fill="url(#spring-glow)"/>
  <circle cx="340" cy="40" r="100" fill="#6db33f" opacity="0.1" filter="blur(30px)"/>
