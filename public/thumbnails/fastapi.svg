      <stop offset="0%" stop-color="#052e2b" />
      <stop offset="100%" stop-color="#021715" />
    </linearGradient>
    <linearGradient id="fastapi-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
