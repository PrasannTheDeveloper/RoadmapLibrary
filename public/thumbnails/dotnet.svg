<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dotnet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512bd4" />
      <stop offset="100%" stop-color="#170c42" />
    </linearGradient>
    <linearGradient id="dotnet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#dotnet-bg)"/>
  <rect x="0" y="0" width="400" height="4" fill="url(#dotnet-glow)"/>
  <circle cx="340" cy="40" r="100" fill="#a855f7" opacity="0.1" filter="blur(30px)"/>
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">.NET</text>
    <text x="64" y="28" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">.NET Backend</text>
    <text x="64" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">C# • ASP.NET Core • EF Core</text>
  </g>
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="55" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">⏱ 18 Weeks</text>
    <rect x="120" y="0" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="175" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">📚 30 Topics</text>
  </g>
